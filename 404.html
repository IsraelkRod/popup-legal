<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pop Up</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="An event on Pop Up">
<meta property="og:description" content="See the booths, the fees and who the host is looking for.">
<meta property="og:image" content="https://popupanalytics.app/assets/popup-logo.png">
<link rel="icon" href="/assets/popup-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
<!--
  Every path the site does not have lands here (GitHub Pages serves 404.html).
  /events/<id> is a link shared from the app: on an iPhone with Pop Up it opens
  the app straight away (.well-known/apple-app-site-association) and this page
  never shows. Everyone else sees the event and two ways in: open the app, or
  get it from the App Store.
-->
<style>
  :root {
    --paper: #FFFFFF;
    --ink: #1A1A1A;
    --outline: #262626;
    --muted: #5C6470;
    --radius-round: 999px;
    --shadow-card: 0 7px 16px rgba(11, 16, 32, 0.14);
    --font-display: "Michroma", "Trebuchet MS", sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 380px; text-align: center; }
  .logo { width: 160px; height: auto; margin-bottom: 28px; }

  /* The event page's top, as the app draws it (event page header pill, hero
     card, theme and status line, place pill). Values from the app's theme:
     glass.ts, glass-title.tsx, event-card.tsx, liquid-glass-rim.tsx,
     seller-meta-line.tsx, project-address-pill.tsx. */

  /* Header pill: the date in Michroma, held in frosted glass (GlassTitle). */
  .date-pill {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 46px; min-width: 160px; padding: 0 24px;
    border-radius: 23px;
    border: 1.5px solid rgba(255, 255, 255, 0.45);
    background: rgba(212, 220, 232, 0.22);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.10);
    font-family: var(--font-display); font-size: 20px; letter-spacing: 0.4px; color: var(--ink);
    margin-bottom: 26px;
  }

  /* Hero card: the photo fills a portrait card (150 by 188), the name sits in
     a white fade at the bottom, chips straddle the top edge as glass bubbles,
     and the edge is the app's liquid glass: an orbiting purple, light and blue
     glow inside the wall, a faint prism fringe, and a crisp meniscus lit from
     the top left. */
  @property --orbit { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  @keyframes orbit { to { --orbit: 360deg; } }
  .hero { position: relative; width: 220px; margin: 14px auto 8px; }
  .photo {
    position: relative;
    height: 276px;
    border-radius: 26px;
    overflow: hidden;
    background: linear-gradient(160deg, #D4DCE8, #C8B8E0) center / cover no-repeat;
    box-shadow: 0 7px 16px rgba(11, 16, 32, 0.14);
  }
  .glass, .glass > i { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; }
  .ring {
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  }
  .glow { filter: blur(10px); }
  .glow > i {
    padding: 21px;
    background: linear-gradient(var(--orbit), rgba(150,116,210,0.9), rgba(226,219,243,0.72), rgba(255,255,255,0.95), rgba(150,167,255,0.85), rgba(200,184,224,0.9));
    animation: orbit 24s linear infinite;
  }
  .lit { filter: blur(6px); }
  .lit > i { padding: 10px; background: linear-gradient(135deg, rgba(255,255,255,0.61), rgba(255,255,255,0) 70%); }
  .fringe-blue { border: 1.2px solid rgba(120,170,255,0.18); transform: translate(0.8px, 0.8px); }
  .fringe-pink { border: 1.2px solid rgba(255,120,210,0.18); transform: translate(-0.8px, -0.8px); }
  .meniscus { padding: 1.3px; background: linear-gradient(135deg, rgba(255,255,255,0.87), rgba(255,255,255,0.22)); }
  .fade {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 46px 14px 10px;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.42) 30%, rgba(255,255,255,0.88) 66%, rgba(255,255,255,0.97));
  }
  /* The name above the glass, the fade under it, as the app layers them. */
  .card-name { position: relative; z-index: 2; margin: 0; font-family: var(--font-body); font-weight: 800; font-size: 22px; line-height: 1.15; color: var(--ink); }
  .chip {
    position: absolute; top: -12px; z-index: 2;
    padding: 4px 11px;
    border-radius: var(--radius-round);
    font-size: 13px; font-weight: 800; letter-spacing: 0.6px;
    box-shadow: inset 0 0 0 1.1px rgba(255,255,255,0.85), inset 0 6px 8px -4px rgba(255,255,255,0.7), 0 3px 8px rgba(0,0,0,0.12);
  }
  .chip.type { left: 16px; color: var(--ink); text-transform: uppercase; }
  .chip.count { right: 16px; color: #FFFFFF; }

  /* Theme and status, the quiet line under the card (MetaLine). */
  .meta { font-size: 15px; letter-spacing: -0.24px; color: rgba(60, 60, 67, 0.6); margin: 0 0 12px; min-height: 20px; }

  /* The place: one white pill that opens directions (ProjectAddressPill). */
  .place {
    display: inline-flex; align-items: center; gap: 8px;
    max-width: 86%;
    padding: 9px 14px;
    border-radius: var(--radius-round);
    border: 1px solid rgba(0, 0, 0, 0.10);
    background: #FFFFFF;
    color: var(--ink); font-size: 14px; font-weight: 700; text-decoration: none;
    margin-bottom: 30px;
  }
  .place span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .place svg { flex: none; }

  h1 { font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.3; margin: 0 0 10px; }
  .when { font-size: 17px; color: var(--muted); margin: 0 0 32px; min-height: 22px; }
  .buttons { display: flex; flex-direction: column; gap: 12px; }
  .button {
    display: block;
    min-height: 52px;
    line-height: 52px;
    border-radius: var(--radius-round);
    font-size: 17px;
    font-weight: 700;
    text-decoration: none;
    box-shadow: var(--shadow-card);
  }
  .button.main { background: var(--ink); color: var(--paper); }
  .button.second { background: var(--paper); color: var(--ink); border: 2px solid var(--outline); line-height: 48px; }
  .note { font-size: 15px; color: var(--muted); margin: 20px 0 0; line-height: 1.4; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>

  <section id="event" hidden>
    <div class="date-pill" id="date" hidden></div>
    <div class="hero">
      <div class="photo" id="photo">
        <div class="fade"><h1 class="card-name" id="name">An event on Pop Up</h1></div>
        <div class="glass glow"><i class="ring"></i></div>
        <div class="glass lit"><i class="ring"></i></div>
        <div class="glass fringe-blue"></div>
        <div class="glass fringe-pink"></div>
        <div class="glass meniscus ring"></div>
      </div>
      <span class="chip type" id="type" hidden></span>
      <span class="chip count" id="count" hidden></span>
    </div>
    <p class="meta" id="meta"></p>
    <a class="place" id="place" hidden>
      <svg width="16" height="16" viewBox="0 0 512 512" aria-hidden="true"><path fill="#FF7289" d="M256 32C167.67 32 96 96.51 96 176c0 128 160 304 160 304s160-176 160-304c0-79.49-71.67-144-160-144zm0 224a64 64 0 1164-64 64.07 64.07 0 01-64 64z"/></svg>
      <span id="place-name"></span>
      <svg width="15" height="15" viewBox="0 0 512 512" aria-hidden="true"><path fill="none" stroke="#5C6470" stroke-linecap="round" stroke-linejoin="round" stroke-width="48" d="M184 112l144 144-144 144"/></svg>
    </a>
    <div class="buttons">
      <a class="button main" id="open">Open in Pop Up</a>
      <a class="button second" href="https://apps.apple.com/app/id6779871658">Get Pop Up on the App Store</a>
    </div>
    <p class="note">Have the app? Tap Open in Pop Up. New to Pop Up? It's free on the App Store.</p>
  </section>

  <section id="missing" hidden>
    <a href="/"><img class="logo" src="/assets/popup-logo.png" alt="Pop Up"></a>
    <h1>This page isn't here</h1>
    <p class="when">It may have moved.</p>
    <div class="buttons"><a class="button second" href="/">Go to Pop Up</a></div>
  </section>
</main>
<script>
  // Where the date stands, the same words the app uses.
  function statusWord(card, event) {
    if (card.canceled) return 'Canceled';
    var now = Date.now();
    var today = new Date().toDateString();
    var at = function (iso) { return iso ? new Date(iso).getTime() : null; };
    var open = at(card.liveAt), checkIn = at(card.checkInAt), wrapUp = at(card.wrapUpAt), close = at(card.closeAt);
    if (open || checkIn || close) {
      if (event.status === 'CLOSED' || (close && now >= close)) {
        return (open && new Date(open).toDateString() === today) || (close && new Date(close).toDateString() === today) ? 'Closed' : 'Past';
      }
      if (wrapUp && now >= wrapUp) return 'Wrap up';
      if (open && now >= open) return 'Open';
      if (checkIn && now >= checkIn) return 'Check-in';
      return open && new Date(open).toDateString() === today ? 'Today' : 'Upcoming';
    }
    var starts = at(card.startsAt || event.startsAt), ends = at(card.endsAt || event.endsAt);
    if (ends && now > ends) return 'Past';
    if (starts && now >= starts) return 'Live';
    return starts && new Date(starts).toDateString() === today ? 'Today' : 'Upcoming';
  }

  (function () {
    var match = location.pathname.match(/^\/events\/([^\/?#]+)/);
    if (!match) {
      document.getElementById('missing').hidden = false;
      return;
    }
    var id = decodeURIComponent(match[1]);
    document.getElementById('event').hidden = false;
    // The app answers its own popup-analytics:// links, so this opens the same date.
    document.getElementById('open').href = 'popup-analytics://events/' + encodeURIComponent(id);

    // The event's public card: its name, date and city.
    fetch('https://popup-backend-r217.onrender.com/api/markets/' + encodeURIComponent(id) + '/detail')
      .then(function (response) { return response.ok ? response.json() : null; })
      .then(function (event) {
        if (!event || !event.name) return;
        var card = event.card || {};
        var name = card.name || event.name;
        var nameEl = document.getElementById('name');
        nameEl.textContent = name;
        document.title = name + ' on Pop Up';
        // The name wraps onto two lines and steps down in size until it fits,
        // never ending in "...".
        for (var size = 22; size > 13 && nameEl.scrollHeight > size * 1.15 * 2 + 2; size -= 1) {
          nameEl.style.fontSize = size - 1 + 'px';
        }
        var image = card.imageUrl || event.imageUrl;
        if (image) document.getElementById('photo').style.backgroundImage = 'url("' + image.replace(/"/g, '') + '")';
        var types = { MARKET: ['Market', '#AAEFD3'], MINOR_RETAIL: ['Static', '#FFFF90'], FLASH_POPUP: ['Collab', '#E4D7EA'] };
        var type = types[card.projectType || event.projectType];
        if (type) {
          var typeEl = document.getElementById('type');
          typeEl.textContent = type[0];
          typeEl.style.background = type[1];
          typeEl.hidden = false;
        }
        if (typeof card.approvedVendorCount === 'number' && card.vendorCapacity) {
          var ratio = card.approvedVendorCount / card.vendorCapacity;
          var countEl = document.getElementById('count');
          countEl.textContent = card.approvedVendorCount + '/' + card.vendorCapacity;
          countEl.style.background = ratio >= 1 ? '#E2574C' : ratio >= 0.8 ? '#E8A13C' : '#22C55E';
          countEl.hidden = false;
        }
        // The header pill: the date as the event page writes it ("Sat · Oct 10").
        var starts = card.startsAt || event.startsAt;
        if (starts) {
          var day = new Date(starts);
          var dateEl = document.getElementById('date');
          dateEl.textContent = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][day.getDay()] + ' \u00b7 ' +
            ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][day.getMonth()] + ' ' + day.getDate();
          dateEl.hidden = false;
        }
        // Theme, then the status word in its own colour (eventStatusWord in the app).
        var word = statusWord(card, event);
        var colors = { Past: '#E2574C', Live: '#27C06A', Open: '#27C06A', 'Check-in': '#3B82F6', 'Wrap up': '#E2574C', Closed: '#8E8E93', Today: '#3B82F6', Upcoming: '#3B82F6', Canceled: '#8E8E93' };
        var theme = ((card.theme || (event.themes || [])[0] || '') + '').trim().split(/\s+/)[0];
        var meta = document.getElementById('meta');
        meta.textContent = theme ? theme + ' \u00b7 ' : '';
        var status = document.createElement('span');
        status.textContent = word;
        status.style.color = colors[word] || 'inherit';
        meta.appendChild(status);
        // The place pill, opening directions in Maps, as on the event page.
        var where = event.location || {};
        var label = [where.venueName, where.city, where.region].filter(Boolean).join(', ');
        if (label) {
          document.getElementById('place-name').textContent = label;
          var placeEl = document.getElementById('place');
          placeEl.href = where.latitude != null && where.longitude != null
            ? 'https://maps.apple.com/?daddr=' + where.latitude + ',' + where.longitude
            : 'https://maps.apple.com/?q=' + encodeURIComponent(label);
          placeEl.hidden = false;
        }
      })
      .catch(function () {});
  })();
</script>
</body>
</html>
