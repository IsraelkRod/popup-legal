<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="cs.doc_title">Pop Up — coming soon</title>
<meta id="metadesc" name="description" data-i18n-attr="content" data-i18n="cs.meta" content="Pop Up is in private beta in San Antonio. Leave your name and we will let you know when it opens up.">
<meta property="og:title" content="Pop Up">
<meta property="og:description" content="Know which markets are worth your Saturday. In private beta in San Antonio.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://popupanalytics.app/">
<meta property="og:image" content="https://popupanalytics.app/assets/popup-logo.png">
<link rel="icon" href="/assets/popup-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------------
 * tokens.css — the single source of truth for the Pop Up website palette.
 *
 * Ported from the app so the site and the app cannot drift apart:
 *   popup_analytics-1.0/src/theme/flow.ts          (palette)
 *   popup_analytics-1.0/src/theme/apple-maps.ts    (radii, shadows, type scale)
 *   popup_analytics-1.0/src/theme/glass.ts         (frosted glass)
 *   popup_analytics-1.0/src/theme/category-colors.ts (the 8 niches)
 *   popup_analytics-1.0/src/theme/motion.ts        (duration, easing)
 *
 * Change a value here and every built page picks it up. Never hard-code a hex
 * in a page; add a token instead.
 * ------------------------------------------------------------------------- */
:root {
  /* Surfaces */
  --paper: #FFFFFF;
  --fill: #EEF1F5;          /* inert filled surface: track, neutral badge */
  --lavender: #EFEBF8;      /* active tab pill in the app */
  --periwinkle: #91A7FF;
  --plate-a: #D4DCE8;       /* hero plate gradient, brand.panelGradient */
  --plate-b: #C8B8E0;

  /* Ink */
  --ink: #1A1A1A;
  --outline: #262626;
  --outline-soft: rgba(38, 38, 38, 0.12);
  --muted: #5C6470;

  /* Actions */
  --coral: #FF7289;         /* the one primary button colour */
  --coral-text: #FFFFFF;
  --live: #27C06A;

  /* Shape: exactly two radii, per the canonical card spec */
  --radius-box: 16px;       /* content frames */
  --radius-pill: 26px;      /* interactive boxes */
  --radius-round: 999px;    /* buttons, chips */

  /* Depth: the shadow is the edge. Solid cards carry no border. */
  --shadow-card: 0 7px 16px rgba(11, 16, 32, 0.14);
  --shadow-control: 0 4px 10px rgba(0, 0, 0, 0.10);

  /* Frosted glass */
  --glass-bg: rgba(212, 220, 232, 0.22);
  --glass-bg-strong: rgba(212, 220, 232, 0.32);
  --glass-border: rgba(255, 255, 255, 0.45);

  /* The 8 canonical niches (category-colors.ts) */
  --niche-food: #F0C000;
  --niche-apparel: #5EB3FF;
  --niche-wellness: #9B59C8;
  --niche-plants: #3FB26B;
  --niche-goods: #E84A68;
  --niche-media: #2F3642;
  --niche-kids: #C7B89F;
  --niche-other: #B2182C;

  /* Motion */
  --dur-fast: 180ms;
  --dur: 280ms;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);

  /* Type. Michroma is the brand standard font and carries every title.
     Body copy stays on the system stack, per the app's readability law. */
  --font-display: "Michroma", "Trebuchet MS", sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;

  --max: 1080px;
}


* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 28px 20px 40px;
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
}

/* The niche-blotch wash, the app's signature look rendered in CSS.
   Same idea as BlottedFill: soft radial blobs of niche colour bleeding off
   the edges of a white surface. */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(38vw 38vw at 12% -6%, rgba(155, 89, 200, 0.20), transparent 62%),
    radial-gradient(34vw 34vw at 92% 4%, rgba(94, 179, 255, 0.20), transparent 60%),
    radial-gradient(40vw 34vw at 84% 98%, rgba(63, 178, 107, 0.16), transparent 62%),
    radial-gradient(34vw 34vw at 4% 92%, rgba(232, 74, 104, 0.14), transparent 60%),
    radial-gradient(30vw 26vw at 50% 46%, rgba(240, 192, 0, 0.10), transparent 66%);
}

.shell { width: 100%; max-width: 560px; text-align: center; }

.logo {
  width: min(280px, 74%);
  height: auto;
  display: block;
  margin: 0 auto 26px;
  filter: drop-shadow(0 10px 22px rgba(11, 16, 32, 0.16));
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-display);
  font-size: 15px;
  letter-spacing: 0.01em;
  color: var(--ink);
  background: var(--lavender);
  border-radius: var(--radius-round);
  padding: 11px 18px;
  margin-bottom: 20px;
  max-width: 100%;
}
.dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--live);
  box-shadow: 0 0 0 3px rgba(39, 192, 106, 0.18);
}

h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(21px, 5.2vw, 31px);
  line-height: 1.34;
  letter-spacing: 0.01em;
  margin: 0 0 16px;
  color: var(--ink);
}

.lede {
  font-size: 17px;
  color: var(--muted);
  margin: 0 auto 28px;
  max-width: 44ch;
}

/* Frosted card, matching the app's glass surfaces */
.card {
  background: var(--glass-bg-strong);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border: 1.5px solid var(--glass-border);
  border-radius: var(--radius-pill);
  box-shadow: var(--shadow-card);
  padding: 26px 22px;
  text-align: left;
}

.card h2 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 15px;
  letter-spacing: 0.02em;
  margin: 0 0 18px;
  text-align: center;
  color: var(--ink);
}

label {
  display: block;
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  margin: 0 0 6px;
}
.field { margin-bottom: 14px; }

input, select {
  width: 100%;
  min-height: 48px;
  padding: 12px 14px;
  font-family: var(--font-body);
  font-size: 16px; /* 16px stops iOS Safari zooming on focus */
  color: var(--ink);
  background: var(--paper);
  border: 1.5px solid var(--outline-soft);
  border-radius: 14px;
  outline: none;
  transition: border-color var(--dur-fast) var(--ease),
              box-shadow var(--dur-fast) var(--ease);
}
select { appearance: none; -webkit-appearance: none;
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath d='M1 1l5 5 5-5' fill='none' stroke='%235C6470' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 14px center;
  background-size: 12px;
  padding-right: 38px;
}
input:focus, select:focus {
  border-color: var(--coral);
  box-shadow: 0 0 0 3px rgba(255, 114, 137, 0.18);
}

button {
  width: 100%;
  min-height: 52px;
  margin-top: 6px;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 15px;
  letter-spacing: 0.03em;
  color: var(--coral-text);
  background: var(--coral);
  border: none;
  border-radius: var(--radius-round);
  box-shadow: var(--shadow-control);
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease),
              opacity var(--dur-fast) var(--ease);
}
button:hover { transform: translateY(-1px); }
button:active { transform: translateY(0); }
button:disabled { opacity: 0.55; cursor: default; transform: none; }

.status {
  display: none;
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 14px;
  font-size: 15px;
  line-height: 1.45;
}
.status.show { display: block; }
.status.ok { background: rgba(39, 192, 106, 0.14); color: #0B3D22; }
.status.err { background: rgba(255, 114, 137, 0.14); color: #7A1226; }
.status a { color: inherit; }

.foot {
  margin-top: 20px;
  font-size: 15px;
  color: var(--muted);
}
.foot a { display: inline-block; min-height: 44px; line-height: 44px;
  padding: 0 9px; color: var(--muted); text-decoration: none; }
.foot a:hover { color: var(--ink); text-decoration: underline; }
.rights { margin-top: 4px; font-size: 15px; color: var(--muted); }

/* Language switcher, same idiom as the app's segmented control */
.langbar {
  position: fixed; top: 14px; right: 14px; z-index: 50;
  display: flex; gap: 2px; padding: 3px;
  background: var(--fill);
  border-radius: var(--radius-round);
}
.langbar button {
  width: auto; min-height: 44px; margin: 0;
  padding: 0 16px;
  font-size: 15px; letter-spacing: 0.02em;
  color: var(--muted); background: transparent;
  border-radius: var(--radius-round); box-shadow: none;
}
.langbar button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: var(--shadow-control); }
.langbar button:hover { transform: none; }

@media (max-width: 560px) {
  body { padding-top: 74px; }   /* clear the fixed language switcher */
  .logo { width: min(240px, 68%); margin-bottom: 22px; }
}
@media (max-width: 420px) {
  .card { padding: 22px 18px; }
  .langbar { top: 10px; right: 10px; }
  h1 { font-size: clamp(19px, 5.6vw, 24px); }
}
</style>
</head>
<body>

<div class="langbar" role="group" aria-label="Language">
  <button type="button" data-lang="en" aria-pressed="true">EN</button>
  <button type="button" data-lang="es" aria-pressed="false">ES</button>
</div>

<main class="shell">
  <img class="logo" src="/assets/popup-logo.png" alt="Pop Up" width="280" height="145">

  <div class="eyebrow"><span class="dot" aria-hidden="true"></span><span data-i18n="cs.eyebrow">Private beta · San Antonio</span></div>

  <h1 data-i18n="cs.h1">Know which markets are worth your Saturday.</h1>
  <p class="lede" data-i18n="cs.lede">Pop Up is in private beta in San Antonio while we get it right. Leave your name and we will come find you when there is a spot.</p>

  <div class="card">
    <h2 data-i18n="cs.card_h">Get on the list</h2>
    <form id="f" novalidate>
      <div class="field">
        <label for="name" data-i18n="cs.f_name">Your name</label>
        <input id="name" name="name" type="text" autocomplete="name" data-i18n-attr="placeholder" data-i18n="cs.ph_name" placeholder="First and last">
      </div>
      <div class="field">
        <label for="email" data-i18n="cs.f_email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" data-i18n-attr="placeholder" data-i18n="cs.ph_email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="persona" data-i18n="cs.f_persona">I'm a…</label>
        <select id="persona" name="persona">
          <option value="" data-i18n="cs.opt_pick">Pick one</option>
          <option value="vendor" data-i18n="cs.opt_vendor">Vendor or maker, I sell at markets</option>
          <option value="host" data-i18n="cs.opt_host">Host, I run markets</option>
          <option value="both" data-i18n="cs.opt_both">Both</option>
          <option value="explorer" data-i18n="cs.opt_shopper">Shopper, I like going to markets</option>
        </select>
      </div>
      <button id="go" type="submit" data-i18n="cs.submit">Keep me posted</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>
  </div>

  <div class="foot">
    <a href="/privacy/" data-i18n="cs.foot_privacy">Privacy</a>
    <a href="/terms/" data-i18n="cs.foot_terms">Terms</a>
    <a href="/support/" data-i18n="cs.foot_support">Support</a>
    <a href="/beta/" data-i18n="cs.foot_beta">Tester hub</a>
  </div>
  <div class="rights">© <span id="year"></span> Pop Up Analytics LLC · San Antonio, TX</div>
</main>

<script>
var API_URL = "https://popup-backend-r217.onrender.com/api/beta-signup";
var SUPPORT_EMAIL = "support@popupanalytics.app";
var DICT = {"en":{"cs":{"doc_title":"Pop Up: coming soon","meta":"Pop Up is in private beta in San Antonio. Leave your name and we will let you know when it opens up.","eyebrow":"Private beta · San Antonio","h1":"Know which markets are worth your Saturday.","lede":"Every pop-up is a gamble. You pay the fee, give up the day, and hope it was worth it. Pop Up is the app that tells you first, and it is in private beta in San Antonio right now.","card_h":"Get on the list","f_name":"Your name","ph_name":"First and last","f_email":"Email","ph_email":"you@example.com","f_persona":"I'm a…","opt_pick":"Pick one","opt_vendor":"Vendor or maker, I sell at markets","opt_host":"Host, I run markets","opt_both":"Both","opt_shopper":"Shopper, I like going to markets","submit":"Keep me posted","sending":"Sending…","ok":"You're on the list. We'll be in touch when there's a spot.","err_required":"Please add your name and tell us which one you are.","err_email":"Please add an email we can reach you at.","err_generic":"That didn't go through. Please try again.","fail_pre":"We couldn't reach our server. ","fail_link":"Send it as an email instead","fail_post":" and we'll add you by hand.","mail_subject":"Pop Up beta list","foot_privacy":"Privacy","foot_terms":"Terms","foot_support":"Support","foot_beta":"Tester hub"}},"es":{"cs":{"doc_title":"Pop Up: muy pronto","meta":"Pop Up está en beta privada en San Antonio. Déjanos tu nombre y te avisamos cuando abra.","eyebrow":"Beta privada · San Antonio","h1":"Descubre qué mercados valen tu sábado.","lede":"Cada pop-up es una apuesta. Pagas la cuota, entregas el día y esperas que valga la pena. Pop Up es la app que te lo dice antes, y ahora está en beta privada en San Antonio.","card_h":"Apúntate a la lista","f_name":"Tu nombre","ph_name":"Nombre y apellido","f_email":"Correo","ph_email":"tu@ejemplo.com","f_persona":"Soy…","opt_pick":"Elige una","opt_vendor":"Vendedor o creador, vendo en mercados","opt_host":"Organizador, yo organizo mercados","opt_both":"Las dos cosas","opt_shopper":"Comprador, me gusta ir a mercados","submit":"Avísame","sending":"Enviando…","ok":"Ya estás en la lista. Te escribimos cuando haya lugar.","err_required":"Agrega tu nombre y dinos cuál eres.","err_email":"Agrega un correo donde podamos contactarte.","err_generic":"No se pudo enviar. Inténtalo de nuevo.","fail_pre":"No pudimos conectar con el servidor. ","fail_link":"Envíalo por correo","fail_post":" y te agregamos a mano.","mail_subject":"Lista beta de Pop Up","foot_privacy":"Privacidad","foot_terms":"Términos","foot_support":"Soporte","foot_beta":"Zona de testers"}}};

document.getElementById("year").textContent = new Date().getFullYear();

/* ---------------- Language ---------------- */
function lookup(lang, path) {
  return path.split(".").reduce(function (o, k) {
    return (o && o[k] !== undefined) ? o[k] : undefined;
  }, DICT[lang]);
}

var currentLang = "en";

function applyLang(lang) {
  if (!DICT[lang]) lang = "en";
  currentLang = lang;
  document.documentElement.lang = lang;

  document.querySelectorAll("[data-i18n]").forEach(function (el) {
    var val = lookup(lang, el.getAttribute("data-i18n"));
    if (val === undefined) return;
    var attr = el.getAttribute("data-i18n-attr");
    if (attr) el.setAttribute(attr, val);
    else el.innerHTML = val;
  });

  document.title = lookup(lang, "cs.doc_title") || document.title;
  document.querySelectorAll(".langbar button").forEach(function (b) {
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  });
  try { localStorage.setItem("pu_lang", lang); } catch (e) {}
}

document.querySelectorAll(".langbar button").forEach(function (b) {
  b.addEventListener("click", function () { applyLang(b.dataset.lang); });
});

var saved = null;
try { saved = localStorage.getItem("pu_lang"); } catch (e) {}
applyLang(saved || ((navigator.language || "en").toLowerCase().indexOf("es") === 0 ? "es" : "en"));

/* ---------------- Signup ---------------- */
var form = document.getElementById("f");
var btn = document.getElementById("go");
var statusEl = document.getElementById("status");

function showStatus(kind, msg) {
  statusEl.className = "status show " + kind;
  statusEl.innerHTML = msg;
}

function mailtoFallback(data) {
  var subject = encodeURIComponent(lookup(currentLang, "cs.mail_subject"));
  var lines = Object.keys(data).filter(function (k) { return data[k]; })
    .map(function (k) { return k + ": " + data[k]; }).join("\n");
  var href = "mailto:" + SUPPORT_EMAIL + "?subject=" + subject + "&body=" + encodeURIComponent(lines);
  showStatus("err", lookup(currentLang, "cs.fail_pre") +
    '<a href="' + href + '">' + lookup(currentLang, "cs.fail_link") + "</a>" +
    lookup(currentLang, "cs.fail_post"));
}

form.addEventListener("submit", function (e) {
  e.preventDefault();
  statusEl.className = "status";

  var data = {
    name: form.name.value.trim(),
    contactEmail: form.email.value.trim(),
    persona: form.persona.value || undefined,
    /* The endpoint requires eventFrequency. The holding page does not ask for
       it, so send a neutral placeholder and tag the note so these signups are
       obvious in Slack and never pollute the segment signal. */
    eventFrequency: "occasional",
    notes: "Signed up from the coming-soon page"
  };

  if (!data.name || !data.persona) {
    showStatus("err", lookup(currentLang, "cs.err_required"));
    return;
  }
  if (!data.contactEmail || data.contactEmail.indexOf("@") < 1) {
    showStatus("err", lookup(currentLang, "cs.err_email"));
    return;
  }

  btn.disabled = true;
  btn.textContent = lookup(currentLang, "cs.sending");

  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  })
    .then(function (res) {
      return res.json().catch(function () { return {}; })
        .then(function (body) { return { ok: res.ok, status: res.status, body: body }; });
    })
    .then(function (r) {
      if (r.ok) {
        form.reset();
        showStatus("ok", lookup(currentLang, "cs.ok"));
        return;
      }
      /* A 5xx means our side is down (a missing Slack webhook returns 503).
         Never show a visitor a raw backend message. Offer email instead. */
      if (r.status >= 500) { mailtoFallback(data); return; }
      var msg = (r.body && r.body.message) || lookup(currentLang, "cs.err_generic");
      if (Array.isArray(msg)) msg = msg.join(" ");
      showStatus("err", msg);
    })
    .catch(function () { mailtoFallback(data); })
    .finally(function () {
      btn.disabled = false;
      btn.textContent = lookup(currentLang, "cs.submit");
    });
});
</script>
</body>
</html>
